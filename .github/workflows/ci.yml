# CI/CD (ticket M1-06, requirements §15.4, adapted to GitHub Actions per the week 1 decision).
# Stages: install → lint/format → typecheck → unit → UI audit → build → integration (Testcontainers)
# → browser + E2E (Playwright) → Docker images (GHCR, tagged with the commit SHA) → staging deploy
# (switched off until a staging server exists, open question Q-08).
# AI evals (stage 7) arrive with MVP 2.
name: CI

on:
  # Every branch push is checked; pull requests show the same run's results.
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same branch cancels the older run; main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  FORCE_COLOR: 1

jobs:
  checks:
    name: Lint, types, unit tests, UI audit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: No merge-conflict markers committed
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!pnpm-lock.yaml'"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ui:audit
      - run: pnpm build

  integration:
    name: Integration tests (Postgres 18, Valkey 8.1, dev stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the tenant isolation suite (packages/db/test/tenant-isolation.int.test.ts).
      - run: pnpm test:integration

  browser:
    name: Browser component tests and E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @setubandh/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          # Baselines that do not exist yet (first Firefox/WebKit run) are written, not failed.
          E2E_UPDATE_SNAPSHOTS: missing
      - name: Upload new screenshot baselines (review, then commit them)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: ignore
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  images:
    name: Docker image (${{ matrix.app }})
    needs: [checks, integration, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: infra/docker/node-app.Dockerfile
          - app: worker
            dockerfile: infra/docker/node-app.Dockerfile
          - app: web
            dockerfile: infra/docker/static-app.Dockerfile
          - app: admin
            dockerfile: infra/docker/static-app.Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs a lowercase owner)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/setubandh-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Deploy to staging
    needs: images
    # Off until a staging server exists (Q-08). Turn on with the repository variable
    # STAGING_ENABLED=true and the secrets STAGING_HOST, STAGING_USER, STAGING_SSH_KEY.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Pull images, migrate, rolling restart
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /srv/setubandh && TAG=$TAG ./deploy.sh"
          rm -f key
