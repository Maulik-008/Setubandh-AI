# Test override for docker-compose.dev.yml: publish on random host ports so the
# integration test can run while a developer's own dev stack is up.
services:
  postgres:
    ports: !override ['127.0.0.1::5432']
  valkey:
    ports: !override ['127.0.0.1::6379']
  s3:
    ports: !override ['127.0.0.1::8333']
  mailpit:
    ports: !override ['127.0.0.1::1025', '127.0.0.1::8025']
