packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Astryx postinstall scripts only print an "run astryx init" nudge; init is done (M1-05).
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  # Optional native speed-ups pulled in by Testcontainers; the pure-JS fallbacks are enough.
  cpu-features: false
  protobufjs: false
  ssh2: false
