        border: c('border'), input: c('input'), ring: c('ring'),

        muted: { DEFAULT: c('muted'), foreground: c('muted-foreground') },
        accent: { DEFAULT: c('accent'), foreground: c('accent-foreground') },
        destructive: { DEFAULT: c('destructive'), ink: c('destructive-ink') },
        success: { DEFAULT: c('success'), ink: c('success-ink') },
        warning: { DEFAULT: c('warning'), ink: c('warning-ink') },
        surface: { 0: c('surface-0'), 1: c('surface-1'), 2: c('surface-2'), 3: c('surface-3'), 4: c('surface-4'), 5: c('surface-5') },
        sidebar: { DEFAULT: c('sidebar-background'), border: c('sidebar-border') },
        chip: {
          blue: c('accent-blue'), violet: c('accent-violet'), emerald: c('accent-emerald'), coral: c('accent-coral'), amber: c('accent-amber'), teal: c('accent-teal'),

        cta: { DEFAULT: c('cta'), foreground: c('cta-foreground') },

        sans: ['Geist', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],

<script>
/* =====================================================================
   Orbit prototype. Plain JS + Paper & Pastel tokens.
   In the real build these screens are React + Astryx components (see requirements, Section 13).
   ===================================================================== */
'use strict';
const HOUR = 3600e3, MIN = 60e3, DAY = 24 * HOUR;
const HUE = {
  blue:    { tint: 'bg-tint-blue',    chipBg: 'bg-chip-blue/10',    chip: 'text-chip-blue',    ink: 'text-chip-blue-ink',    fill: 'fill-chip-blue',    bar: 'bg-chip-blue' },
  violet:  { tint: 'bg-tint-violet',  chipBg: 'bg-chip-violet/10',  chip: 'text-chip-violet',  ink: 'text-chip-violet-ink',  fill: 'fill-chip-violet',  bar: 'bg-chip-violet' },
  emerald: { tint: 'bg-tint-emerald', chipBg: 'bg-chip-emerald/10', chip: 'text-chip-emerald', ink: 'text-chip-emerald-ink', fill: 'fill-chip-emerald', bar: 'bg-chip-emerald' },
  coral:   { tint: 'bg-tint-coral',   chipBg: 'bg-chip-coral/10',   chip: 'text-chip-coral',   ink: 'text-chip-coral-ink',   fill: 'fill-chip-coral',   bar: 'bg-chip-coral' },
  amber:   { tint: 'bg-tint-amber',   chipBg: 'bg-chip-amber/10',   chip: 'text-chip-amber',   ink: 'text-chip-amber-ink',   fill: 'fill-chip-amber',   bar: 'bg-chip-amber' },
  teal:    { tint: 'bg-tint-teal',    chipBg: 'bg-chip-teal/10',    chip: 'text-chip-teal',    ink: 'text-chip-teal-ink',    fill: 'fill-chip-teal',    bar: 'bg-chip-teal' },
};
const HUES = ['blue', 'violet', 'emerald', 'coral', 'amber', 'teal'];
const CH = {
  whatsapp:  { label: 'WhatsApp',  icon: 'message-circle', hue: 'emerald' },
  instagram: { label: 'Instagram', icon: 'instagram',      hue: 'coral' },
  messenger: { label: 'Messenger', icon: 'facebook',       hue: 'blue' },
};
const MODE = {
  ai:     { label: 'AI',     hue: 'violet', icon: 'sparkles',      help: 'AI replies on its own' },
  assist: { label: 'Assist', hue: 'blue',   icon: 'wand-sparkles', help: 'AI drafts, you send' },
  human:  { label: 'Human',  hue: 'teal',   icon: 'user-round',    help: 'AI stays silent' },
};
const STAGES = [
  { id: 'new', name: 'New', hue: 'blue' }, { id: 'contacted', name: 'Contacted', hue: 'violet' },
  { id: 'qualified', name: 'Qualified', hue: 'amber' }, { id: 'won', name: 'Won', hue: 'emerald' }, { id: 'lost', name: 'Lost', hue: 'coral' },
];
const SOURCE = { whatsapp: 'emerald', instagram: 'coral', messenger: 'blue', comment: 'amber', manual: 'teal' };
const HANDOFF = {
  asked_for_human: 'Customer asked for a person', complaint: 'Complaint or problem', pricing_negotiation: 'Discount or custom price',
  low_confidence: 'AI was not sure', ai_paused: 'AI is paused', order_value: 'Large order',
};

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const num = (n) => Math.round(n).toLocaleString('en-IN');
let UID = 2000; const nid = (p) => p + (++UID);
const now = () => Date.now() + S.clockOffset;
const tFmt = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit' });
const dFmt = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short' });
const hm = (t) => tFmt.format(new Date(t));
function ago(t) {
  const d = now() - t; if (d < MIN) return 'now';
  if (d < HOUR) return Math.floor(d / MIN) + 'm'; if (d < DAY) return Math.floor(d / HOUR) + 'h';
  return Math.floor(d / DAY) + 'd';
}
const icon = (n, cls = 'h-4 w-4') => `<i data-lucide="${n}" class="${cls}" aria-hidden="true"></i>`;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

/* ---------- UI atoms (Paper & Pastel recipes) ---------- */
const BTN_CTA = 'press inline-flex items-center justify-center gap-1.5 rounded-full bg-cta px-4 py-2 text-[13px] font-medium text-cta-foreground disabled:opacity-50';
const BTN_OUT = 'press inline-flex items-center justify-center gap-1.5 rounded-full border border-border bg-background px-3.5 py-2 text-[13px] font-medium text-foreground hover:bg-accent disabled:opacity-50';
const BTN_GHOST = 'press inline-flex items-center justify-center gap-1.5 rounded-full px-3 py-2 text-[13px] font-medium text-foreground hover:bg-accent';
const BTN_DANGER = 'press inline-flex items-center justify-center gap-1.5 rounded-full border border-destructive/40 bg-background px-3.5 py-2 text-[13px] font-medium text-destructive-ink hover:bg-destructive/5';
const INPUT = 'w-full rounded-[10px] border border-input bg-background px-3 py-2 text-[16px] text-foreground placeholder:text-muted-foreground/80 focus:outline-none focus:ring-2 focus:ring-ring/40 sm:text-[13px]';
const CARD = 'rounded-[24px] border border-border bg-surface-1';
const LABEL = 'mb-1.5 block text-[12px] font-medium text-foreground';
const META = 'font-mono text-[11px] text-muted-foreground';
const EYEBROW = 'font-mono text-[11px] uppercase tracking-[0.12em] text-muted-foreground';

const pill = (text, hue, ic) => `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full ${HUE[hue].tint} px-2 py-0.5 text-[11px] font-medium ${HUE[hue].ink}">${ic ? icon(ic, 'h-3 w-3') : ''}${esc(text)}</span>`;
const neutralPill = (text, ic) => `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full border border-border bg-background px-2 py-0.5 text-[11px] font-medium text-muted-foreground">${ic ? icon(ic, 'h-3 w-3') : ''}${esc(text)}</span>`;
const chipIcon = (ic, hue, size = 'h-8 w-8', isz = 'h-4 w-4') => `<span class="flex ${size} shrink-0 items-center justify-center rounded-full ${HUE[hue].chipBg}">${icon(ic, isz + ' ' + HUE[hue].chip)}</span>`;
function avatar(name, hue, size = 'h-9 w-9', ch) {
  const ini = name.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  const badge = ch ? `<span class="absolute -bottom-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full border-2 border-background ${HUE[CH[ch].hue].tint}">${icon(CH[ch].icon, 'h-2.5 w-2.5 ' + HUE[CH[ch].hue].ink)}</span>` : '';
  return `<span class="relative inline-flex ${size} shrink-0 items-center justify-center rounded-full ${HUE[hue].tint} text-[12px] font-semibold ${HUE[hue].ink}">${esc(ini)}${badge}</span>`;
}
const toggle = (on, action, arg, label) => `<button type="button" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-action="${action}" data-arg="${esc(arg)}" class="relative inline-flex h-6 w-10 shrink-0 items-center rounded-full p-0.5 transition-colors duration-150 ${on ? 'bg-chip-emerald' : 'bg-surface-4'}"><span class="block h-5 w-5 rounded-full bg-background transition-transform duration-150 ${on ? 'translate-x-4' : ''}"></span></button>`;
function segmented(items, current, action, label, extra = '') {
  return `<div role="group" aria-label="${esc(label)}" class="inline-flex rounded-full border border-border bg-surface-1 p-0.5 ${extra}">${items.map((it) => `
    <button type="button" data-action="${action}" data-arg="${esc(it.id)}" aria-pressed="${it.id === current}" class="press inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-3 py-1.5 text-[12px] font-medium ${it.id === current ? 'bg-background text-foreground shadow-[0_1px_2px_hsl(var(--shadow-color)/.08)] ring-1 ring-border' : 'text-muted-foreground hover:text-foreground'}">${it.icon ? icon(it.icon, 'h-3.5 w-3.5') : ''}${esc(it.label)}${it.count != null ? `<span class="font-mono text-[10px] tabular">${it.count}</span>` : ''}</button>`).join('')}</div>`;
}
function meter(label, value, limit, hue, unit = '') {
  const pct = Math.min(100, Math.round((value / limit) * 100));
  const warn = pct >= 80;
  return `<div><div class="mb-1.5 flex items-baseline justify-between gap-3"><span class="text-[13px] text-foreground">${esc(label)}</span><span class="font-mono text-[12px] tabular text-muted-foreground">${num(value)} of ${num(limit)}${unit}</span></div>
  <div class="h-1.5 overflow-hidden rounded-full bg-surface-3" role="meter" aria-valuemin="0" aria-valuemax="${limit}" aria-valuenow="${value}" aria-label="${esc(label)}"><div class="h-full rounded-full ${warn ? 'bg-chip-amber' : HUE[hue].bar}" style="width:${pct}%"></div></div>

  el.innerHTML = `${opts.icon ? icon(opts.icon, 'h-4 w-4 ' + HUE[opts.hue || 'emerald'].chip) : icon('check', 'h-4 w-4 text-chip-emerald')}<span>${text}</span>${opts.undo ? '<button type="button" class="rounded-full px-2 py-0.5 text-[12px] font-medium text-primary hover:bg-accent">Undo</button>' : ''}`;
  if (opts.undo) el.querySelector('button').onclick = () => { opts.undo(); el.remove(); render(); };
  wrap.appendChild(el); paintIcons(el);
  setTimeout(() => el.remove(), opts.undo ? 6000 : 3200);
}

function convFor(ct, channel, create = true, source) {
  let cv = S.convs.find((x) => x.contactId === ct.id && x.channel === channel);
  if (!cv && create) {
    const defMode = S.tenant.aiPaused ? 'human' : 'ai';
    cv = { id: nid('cv'), contactId: ct.id, channel, mode: defMode, status: 'open', assignee: null, messages: [], unread: 0, draft: '', aiDraft: null, lastInbound: now(), lastAt: now(), ctx: { fallbacks: 0 }, source: source || channel, labels: [], summary: '' };
    S.convs.unshift(cv);
    const open_ = S.leads.find((l) => l.contactId === ct.id && !['won', 'lost'].includes(l.stage));
    if (open_ && !open_.conv) open_.conv = cv.id;
    if (!open_)
      S.leads.unshift({ id: nid('l'), contactId: ct.id, title: 'New enquiry', value: 0, stage: 'new', owner: null, source: source || channel, conv: cv.id, updated: now(), score: 20 });
  }

}
function pushMsg(cv, from, text, extra = {}) {
  const m = { id: nid('msg'), from, text, at: now(), status: from === 'contact' ? 'received' : 'sent', ...extra };
  cv.messages.push(m); cv.lastAt = m.at;
  if (from !== 'contact' && from !== 'note' && from !== 'system') setTimeout(() => { m.status = 'delivered'; render(); setTimeout(() => { if (S.sim.open) { m.status = 'read'; render(); } }, 1400); }, 700);
  return m;
}
function customerSays(cv, text, extra = {}) {

  logWebhook(cv.channel === 'whatsapp' ? 'whatsapp_business_account' : cv.channel === 'instagram' ? 'instagram' : 'page', 'messages');
  pushMsg(cv, 'contact', text, extra);
  cv.lastInbound = now(); cv.unread += (S.inbox.active === cv.id && S.route === 'inbox') ? 0 : 1;
  if (cv.status === 'resolved' || cv.status === 'pending') cv.status = 'open';
  if (cv.followup) { cv.followup = null; S.followups[0].replied++; S.followups[0].enrolled = Math.max(0, S.followups[0].enrolled - 1); S.autoRuns.unshift({ at: now(), what: `Follow-up stopped: ${ct.name} replied`, hue: 'emerald' }); }
  if (/^\s*(stop|unsubscribe)\s*$/i.test(text)) { ct.optOut = true; pushMsg(cv, 'automation', 'You are unsubscribed from offers. You will still get replies when you message us.'); render(); return; }
  if (/\b(hi|hello|hey|namaste)\b/i.test(text) && cv.channel === 'whatsapp') tourDone('sim_hi');
  if (S.tenant.aiPaused && cv.mode === 'ai') { handoff(cv, 'ai_paused', `${ct.name} wrote while AI was paused: “${text}”`, false); render(); return; }
  if (cv.mode === 'ai') { scheduleAI(cv); }
  else if (cv.mode === 'assist') { S.inbox.drafting[cv.id] = true; render(); setTimeout(() => { const r = aiCompose(cv, text, true); cv.aiDraft = r.text; S.inbox.drafting[cv.id] = false; S.usage.ai++; render(); }, 1100); }
  else { if (cv.assignee) notify('message-circle', 'teal', `${ct.name} replied in a conversation assigned to ${member(cv.assignee).name}`, cv.id); }

}
const AI_TIMERS = {};
function scheduleAI(cv) {
  clearTimeout(AI_TIMERS[cv.id]); S.inbox.drafting[cv.id] = true; render();
  AI_TIMERS[cv.id] = setTimeout(() => {
    S.inbox.drafting[cv.id] = false;
    if (cv.mode !== 'ai' || !windowOpen(cv)) { render(); return; }
    const lastText = [...cv.messages].reverse().find((m) => m.from === 'contact').text;
    const r = aiCompose(cv, lastText, false);
    if (r.handoff) { handoff(cv, r.handoff.reason, r.handoff.summary, true, r.text); }
    else { pushMsg(cv, 'ai', r.text, { tools: r.tools, card: r.card, lang: r.lang, ms: 900 + Math.floor(Math.random() * 1900), model: r.model }); S.usage.ai++; }
    afterAI(cv, r); render();
  }, 1400);
}
function afterAI(cv, r) {
  const ld = leadFor(cv.contactId); if (!ld) return;
  if (r.leadTitle && (ld.title === 'New enquiry' || ld.value === 0)) { ld.title = r.leadTitle; }
  if (r.value && ld.stage !== 'won') ld.value = r.value;
  if (ld.stage === 'new') { ld.stage = 'contacted'; ld.score = 45; }
  if (r.qualified && ld.stage === 'contacted') { ld.stage = 'qualified'; ld.score = 75; S.autoRuns.unshift({ at: now(), what: `AI moved ${contact(cv.contactId).name} to Qualified (product and size known)`, hue: 'amber' }); }
  ld.updated = now();
}
function handoff(cv, reason, summary, withMsg = true, text) {
  const ct = contact(cv.contactId);
  cv.mode = 'human';
  const online = S.members.filter((m) => m.status === 'online' && m.role !== 'Owner');
  cv.assignee = online.length ? online[(S.convs.filter((x) => x.mode === 'human').length) % online.length].id : null;
  pushMsg(cv, 'system', `Handed to a person: ${HANDOFF[reason] || reason}`, { event: 'handoff', summary });
  if (withMsg) pushMsg(cv, 'ai', text || 'Sure, I am connecting you with a teammate now. They usually reply within 10 minutes during store hours.', { tools: ['handoff_to_human'] });
  if (cv.assignee) pushMsg(cv, 'system', `Auto-assigned to ${member(cv.assignee).name} (round robin, online agents)`, { event: 'assign' });
  cv.summary = summary;
  notify('hand', 'coral', `${ct.name} needs a person: ${(HANDOFF[reason] || reason).toLowerCase()}`, cv.id);
  if (reason !== 'ai_paused') tourDone('handoff');
}

/* ---------- the simulated AI (rule based so the prototype works offline) ---------- */
function findProduct(t) {
  let best = null, score = 0;
  for (const p of S.products) { const s = p.words.reduce((a, w) => a + (t.includes(w) ? (w === 'kurta' || w === 'saree' || w === 'sari' ? 1 : 2) : 0), 0); if (s > score) { score = s; best = p; } }
  return score >= 2 ? best : null;
}
const CATS = { kurta: 'Kurtas', kurtas: 'Kurtas', saree: 'Sarees', sarees: 'Sarees', sari: 'Sarees', dupatta: 'Dupattas', lehenga: 'Lehengas', set: 'Kurta sets' };
function aiCompose(cv, raw, draftOnly) {
  const ct = contact(cv.contactId) || { name: 'Test customer' }; const t = raw.toLowerCase(); const ctx = cv.ctx; const name = first(ct.name);
  const hing = /\b(kitna|kitne|hai|chahiye|kya|bhai|ji|kab|aapke|mujhe|haan)\b/.test(t);
  const R = (text, extra = {}) => ({ text, tools: [], model: 'claude-haiku-5-5', lang: hing ? 'Hinglish' : null, ...extra });
  const rules = S.ai.rules;
  if (!draftOnly) {
    if (rules.askHuman && /(human|person|someone|agent|real person|talk to|call me|manager|insaan|baat kar)/.test(t)) return R('', { handoff: { reason: 'asked_for_human', summary: `${ct.name} asked for a person. ${ctx.product ? 'Interested in ' + product(ctx.product).name + (ctx.size ? ', size ' + ctx.size : '') + '. ' : ''}Last message: “${raw}”.` } });
    if (rules.complaint && /(late|delay|damaged|broken|wrong item|complaint|refund|not received|worst|angry)/.test(t)) return R('I am sorry about that. I have passed this to our team with your details so a person can sort it out quickly.', { handoff: { reason: 'complaint', summary: `${ct.name} reported a problem: “${raw}”. Check the order and courier status.` } });
    if (/(discount|offer|cheaper|best price|less price|kam|bulk|wholesale)/.test(t)) {
      if (rules.discount) return R('Let me bring in a teammate who can help with pricing. They will reply here shortly.', { handoff: { reason: 'pricing_negotiation', summary: `${ct.name} asked about a discount: “${raw}”.${ctx.product ? ' Product: ' + product(ctx.product).name + '.' : ''}` } });
      return R('Our prices are fixed, but every order above ₹1,999 ships free and you can pay by cash on delivery up to ₹5,000.', { tools: ['get_business_info'] });
    }
  }
  /* order flow */
  const o = ctx.order;
  if (o && o.step) {
    const p = product(o.p);
    if (o.step === 'size') {
      const m = t.match(/\b(xs|s|m|l|xl|small|medium|large)\b/); const map = { small: 'S', medium: 'M', large: 'L' };
      if (!m) return R(`Which size would you like? In stock: ${sizesInStock(p).join(', ')}.`);
      const sz = (map[m[1]] || m[1]).toUpperCase();
      if (!p.sizes[sz]) return R(`Size ${sz} is sold out in the ${p.name}. Available: ${sizesInStock(p).join(', ')}. Which one should I note?`, { tools: ['get_product'] });
      o.size = sz; o.step = 'qty'; ctx.size = sz; return R(`${sz} it is. How many would you like?`, { tools: ['get_product'], qualified: true });
    }
    if (o.step === 'qty') { const n = parseInt((t.match(/\d+/) || ['1'])[0], 10); o.qty = Math.max(1, Math.min(n, 20)); o.step = 'details';
      if (rules.orderValue && p.price * o.qty > 20000 && !draftOnly) { o.step = null; return R('That is a lovely large order. A teammate will confirm stock and delivery for you personally.', { handoff: { reason: 'order_value', summary: `${ct.name} wants ${o.qty} x ${p.name} (${inr(p.price * o.qty)}). Above the ₹20,000 handoff rule.` } }); }
      return R(`Great, ${o.qty} x ${p.name}. Please share your full name and delivery address with pincode.`); }
    if (o.step === 'details') { o.address = raw; o.step = 'confirm'; const sub = p.price * o.qty; const ship = sub >= 1999 ? 0 : 99; o.total = sub + ship;
      return R(`Here is your order:\n- ${p.name} (${o.size}) x${o.qty}: ${inr(sub)}\n- Shipping: ${ship ? inr(ship) : 'free'}\n- Total: ${inr(o.total)}\nDeliver to: ${raw}\nReply YES to confirm, or tell me what to change.`, { tools: ['create_order_draft'], value: o.total }); }
    if (o.step === 'confirm') {
      if (/\b(yes|confirm|ok|okay|haan|done|sure)\b/.test(t)) {
        if (draftOnly || cv.sandbox) return R('Confirmed! I will share the payment link and order number now.', { tools: ['confirm_order'] });
        const no = 'KT-' + (1043 + S.orders.length - 3);
        p.sizes[o.size] = Math.max(0, (p.sizes[o.size] || 0) - o.qty);
        S.orders.unshift({ id: nid('o'), no, contactId: ct.id, items: [{ p: p.id, size: o.size, qty: o.qty }], total: o.total, status: 'Confirmed', by: 'AI', at: now(), channel: cv.channel, address: o.address });
        const ld = leadFor(ct.id); if (ld) { ld.stage = 'won'; ld.value = o.total; ld.title = `${p.name}, ${o.size}`; ld.score = 100; ld.updated = now(); }
        notify('shopping-bag', 'emerald', `New order ${no} from ${ct.name}, ${inr(o.total)}`, cv.id);
        S.autoRuns.unshift({ at: now(), what: `Order ${no} confirmed by AI, lead moved to Won`, hue: 'emerald' });
        ctx.order = null; tourDone('order');
        return R(`Order ${no} is confirmed! Total ${inr(o.total)}. Pay by UPI with the link we send next, or choose cash on delivery. Thank you, ${name}!`, { tools: ['confirm_order'] });
      }

    }
  }
  if (/(order|buy|purchase|i want it|i'll take|book it|place)/.test(t) && !/(my order|order status)/.test(t)) {
    const p = findProduct(t) || (ctx.product && product(ctx.product));
    if (!p) { ctx.pendingOrder = true; return R('Happy to help you order! Which product would you like? You can say a name like “indigo kurta” or “ajrakh saree”.'); }
    ctx.product = p.id; ctx.order = { p: p.id, step: Object.keys(p.sizes).length > 1 ? 'size' : 'qty', size: Object.keys(p.sizes).length > 1 ? null : 'Free' };
    if (ctx.size && p.sizes[ctx.size]) { ctx.order.size = ctx.size; ctx.order.step = 'qty'; return R(`Lovely! ${p.name} in ${ctx.size}. How many would you like?`, { tools: ['get_product'], leadTitle: `${p.name}, ${ctx.size}`, value: p.price, qualified: true }); }
    return R(ctx.order.step === 'size' ? `Lovely choice! Which size for the ${p.name}? In stock: ${sizesInStock(p).join(', ')}.` : `Lovely choice! How many ${p.name} would you like?`, { tools: ['get_product'], leadTitle: p.name, value: p.price });
  }
  if (/(book|appointment|video call|stylist|visit)/.test(t) && !/(store|address)/.test(t)) return R('You can book a 15-minute video call with our stylist here: kesarithreads.in/book. Pick any slot that suits you.', { tools: ['get_booking_link'] });
  /* product questions */

  const sizeQ = t.match(/\b(xs|s|m|l|xl)\b/) && /(size|available|have|stock|in )/.test(t);
  if (sizeQ) {
    const pp = p || (ctx.product && product(ctx.product));
    if (pp) { const sz = t.match(/\b(xs|s|m|l|xl)\b/)[1].toUpperCase(); ctx.product = pp.id;
      if (pp.sizes[sz]) { ctx.size = sz; return R(`Good news, the ${pp.name} is available in ${sz} (${pp.sizes[sz]} left). Shall I place the order?`, { tools: ['get_product'], qualified: true, leadTitle: `${pp.name}, ${sz}`, value: pp.price }); }
      return R(`The ${pp.name} is sold out in ${sz}. It is available in ${sizesInStock(pp).join(', ')}. Would one of those work?`, { tools: ['get_product'] }); }
  }
  if (p) {
    ctx.product = p.id; if (ctx.pendingOrder) { ctx.pendingOrder = false; ctx.order = { p: p.id, step: Object.keys(p.sizes).length > 1 ? 'size' : 'qty', size: Object.keys(p.sizes).length > 1 ? null : 'Free' }; return R(`Great choice! Which size for the ${p.name}? In stock: ${sizesInStock(p).join(', ')}.`, { tools: ['get_product'], card: p.id }); }
    if (askPrice) tourDone('price');
    const szs = sizesInStock(p); const sizeTxt = Object.keys(p.sizes).length > 1 ? ` Sizes in stock: ${szs.join(', ')}.` : ` ${p.sizes.Free} in stock.`;
    const free = p.price >= 1999 ? ' Shipping is free.' : '';
    if (hing) return R(`${p.name} ka price ${inr(p.price)} hai.${sizeTxt} Aapka size bataiye, main check karti hoon.`, { tools: ['search_products'], card: p.id, leadTitle: p.name, value: p.price });
    return R(`The ${p.name} is ${inr(p.price)}.${sizeTxt}${free} Want me to check your size or show similar styles?`, { tools: ['search_products'], card: p.id, leadTitle: p.name, value: p.price });
  }
  const catKey = Object.keys(CATS).find((k) => new RegExp('\\b' + k + '\\b').test(t));
  if (catKey) { const list = S.products.filter((x) => x.cat === CATS[catKey]).slice(0, 3);
    if (list.length) return R(`Here are our ${CATS[catKey].toLowerCase()}:\n${list.map((x) => `- ${x.name}: ${inr(x.price)}`).join('\n')}\nWhich one would you like to see?`, { tools: ['search_products'] }); }
  if (askPrice) { const list = S.products.slice(0, 3); return R(`Here are a few favourites:\n${list.map((x) => `- ${x.name}: ${inr(x.price)}`).join('\n')}\nTell me which one and I will check sizes.`, { tools: ['search_products'] }); }
  const faq = S.faqs.find((f) => f.keys.some((k) => t.includes(k)));

  setTimeout(() => {
    if (!rule) { cm.status = 'skipped'; S.autoRuns.unshift({ at: now(), what: `Comment “${text}” did not match any rule`, hue: 'blue' }); render(); return; }
    const p = product(post.productId); rule.runs++;
    cm.status = 'auto_replied';
    if (rule.publicReply) cm.reply = pick(['Sent you the details in DM', 'Check your DMs for price and sizes', 'We have messaged you the details']);
    const cv = convFor(ct, 'instagram', true, 'comment');

    cv.ctx.product = p.id; cv.lastInbound = now(); S.usage.ai++;
    const ld = leadFor(ct.id); if (ld) { ld.source = 'comment'; ld.title = p.name; ld.value = p.price; if (ld.stage === 'new') ld.stage = 'contacted'; }

    S.sim.igTab = 'dm'; tourDone('comment_dm');

    render();

}

/* =====================================================================
   FOLLOW-UPS (time travel)
   ===================================================================== */
function simulateDay() {
  S.clockOffset += DAY; let sent = 0;
  const seq = S.followups[0];
  for (const cv of S.convs) {
    const ld = S.leads.find((l) => l.conv === cv.id); const ct = contact(cv.contactId);
    if (!ld || !seq.active || !seq.stages.includes(ld.stage) || cv.mode !== 'ai' || cv.status === 'resolved' || ct.optOut) continue;
    if (now() - cv.lastInbound < 24 * HOUR) continue;
    const lastOut = [...cv.messages].reverse().find((m) => m.followup);
    if (lastOut && now() - lastOut.at < 20 * HOUR) continue;
    const step = cv.followup ? cv.followup.step : 0;
    const st = seq.steps[step]; if (!st) continue;
    if (st.mode === 'lost') { ld.stage = 'lost'; ld.lostReason = 'No response'; pushMsg(cv, 'system', 'Follow-up sequence finished without a reply. Lead moved to Lost.', { event: 'auto' }); cv.followup = null; continue; }
    const tpl = S.templates.find((x) => x.name === st.tpl);
    const pname = cv.ctx.product ? product(cv.ctx.product).name : 'outfit you liked';
    const body = tpl.body.replace('{{1}}', first(ct.name)).replace('{{2}}', pname);
    pushMsg(cv, 'automation', body, { template: tpl.name, followup: true });
    cv.followup = { seq: seq.id, step: step + 1 }; cv.status = 'pending'; seq.sent++; sent++;
    if (step === 0) seq.enrolled++;
    S.autoRuns.unshift({ at: now(), what: `Follow-up step ${step + 1} sent to ${ct.name} as template “${tpl.name}” (window closed)`, hue: 'violet' });
  }
  tourDone('followup');
  toast(sent ? `24 hours passed. ${sent} follow-up${sent > 1 ? 's' : ''} sent as approved templates.` : '24 hours passed. No quiet leads were due a follow-up.', { icon: 'clock', hue: 'violet' });
  render();
}

function chartBars(data, opts = {}) {

        ${cv.status === 'resolved' ? `<button type="button" data-action="reopen" class="${BTN_OUT}" ${readOnly() ? 'disabled' : ''}>Reopen</button>` : `<button type="button" data-action="resolve" class="${BTN_OUT}" ${readOnly() ? "disabled" : ""}>${icon('check', 'h-3.5 w-3.5')} Resolve</button>`}
        <button type="button" data-action="openContactDrawer" data-arg="${cv.id}" class="${BTN_GHOST} 2xl:hidden" aria-label="Contact details">${icon('panel-right', 'h-4 w-4')}</button>
      </div>
    </div>
    <p class="sr-only">${MODE[cv.mode].help}</p>
    <ol id="thread" class="min-h-0 flex-1 space-y-2.5 overflow-y-auto px-3 py-4 sm:px-5" aria-live="polite">

    </ol>
    ${cv.status === 'resolved' ? `<div class="border-t border-border p-4 text-center text-[13px] text-muted-foreground">This conversation is resolved. A new customer message reopens it${S.settings.autoReturn === 'resolve' ? ' with the AI in charge' : ''}.</div>` : composer(cv)}
  </section>`;
  return `<div class="flex h-full min-h-0">${listPane}${thread}<aside aria-label="Contact details" class="hidden w-[300px] shrink-0 overflow-y-auto border-l border-border bg-surface-1 p-3 2xl:block">${detailsRail(cv)}</aside></div>`;
}

/* =====================================================================
   PIPELINE
   ===================================================================== */
function renderPipeline() {

  return `<div class="flex h-full min-h-0 flex-col px-4 py-6 sm:px-6 lg:px-8">
    ${pageHead('Pipeline', `${S.leads.filter((l) => !['won', 'lost'].includes(l.stage)).length} open leads · ${inr(S.leads.filter((l) => !['won', 'lost'].includes(l.stage)).reduce((a, l) => a + l.value, 0))} in play`, `<button type="button" data-action="newLead" class="${BTN_CTA}">${icon('plus', 'h-3.5 w-3.5')} Add lead</button>`)}
    <div class="mb-4 flex flex-wrap items-center gap-1.5"><span class="${META} mr-1">Source</span>${['all', 'whatsapp', 'instagram', 'messenger', 'comment'].map((k) => `<button type="button" data-action="pipeSource" data-arg="${k}" aria-pressed="${src === k}" class="press rounded-full border px-2.5 py-1 text-[12px] font-medium ${src === k ? 'border-transparent bg-cta text-cta-foreground' : 'border-border bg-background text-muted-foreground hover:text-foreground'}">${k === 'all' ? 'All' : k === 'comment' ? 'Comments' : CH[k].label}</button>`).join('')}
      <span class="ml-auto hidden ${META} sm:inline">Drag cards between stages. AI moves leads to Contacted, Qualified and Won on its own.</span></div>
    <div class="grid min-h-0 flex-1 auto-cols-[minmax(260px,1fr)] grid-flow-col gap-3 overflow-x-auto pb-2">
      ${STAGES.map((s) => { const col = leads.filter((l) => l.stage === s.id).sort((a, b) => b.updated - a.updated); return `
      <section data-drop="${s.id}" aria-label="${s.name} stage" class="flex min-h-0 flex-col rounded-[24px] bg-surface-1 p-3">
        <div class="mb-3 flex items-center gap-2 px-1"><span class="h-2 w-2 rounded-full ${HUE[s.hue].bar}"></span><h2 class="font-mono text-[11px] font-medium uppercase tracking-[0.12em] text-foreground">${s.name}</h2><span class="rounded-full bg-background px-2 py-0.5 font-mono text-[10px] tabular text-muted-foreground ring-1 ring-border">${col.length}</span><span class="ml-auto font-mono text-[11px] tabular text-muted-foreground">${inr(col.reduce((a, l) => a + l.value, 0))}</span></div>
        <ul class="min-h-[80px] flex-1 space-y-2 overflow-y-auto">${col.map((l) => { const ct = contact(l.contactId); return `<li draggable="true" data-drag="${l.id}" class="lift cursor-grab rounded-[18px] border border-border bg-background p-3 active:cursor-grabbing">
          <button type="button" data-action="openLead" data-arg="${l.id}" class="w-full text-left"><span class="flex items-center gap-2">${avatar(ct.name, ct.hue, 'h-7 w-7 text-[10px]')}<span class="min-w-0 flex-1 truncate text-[13px] font-medium text-foreground">${esc(ct.name)}</span><span class="${META}">${ago(l.updated)}</span></span>
          <span class="mt-2 block truncate text-[12px] text-muted-foreground">${esc(l.title)}</span>
          <span class="mt-2 flex items-center gap-1.5"><span class="font-mono text-[13px] font-semibold tabular text-foreground">${inr(l.value)}</span><span class="flex-1"></span>${pill(l.source === 'comment' ? 'Comment' : CH[l.source] ? CH[l.source].label : 'Manual', SOURCE[l.source] || 'teal')}${l.owner ? avatar(member(l.owner).name, member(l.owner).hue, 'h-5 w-5 text-[9px]') : ''}</span>
          ${l.lostReason ? `<span class="mt-1.5 block ${META}">Lost: ${esc(l.lostReason)}</span>` : ''}</button></li>`; }).join('') || `<li class="rounded-[18px] border border-dashed border-border p-4 text-center text-[12px] text-muted-foreground">Drop a lead here</li>`}</ul>
      </section>`; }).join('')}

}

/* =====================================================================
   CONTACTS AND ORDERS
   ===================================================================== */
function table(head, rows, label) {
  return `<div class="overflow-x-auto rounded-[24px] border border-border bg-background"><table class="w-full min-w-[720px] text-left text-[13px]" aria-label="${esc(label)}"><thead><tr class="border-b border-border bg-surface-1">${head.map((h) => `<th scope="col" class="px-4 py-2.5 font-mono text-[11px] font-medium uppercase tracking-[0.08em] text-muted-foreground">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function renderContacts() {
  const q = (S.contactsQ || '').toLowerCase();
  const list = S.contacts.filter((c) => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q) || c.city.toLowerCase().includes(q));
  return `<div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    ${pageHead('Contacts', `${num(1284 + S.contacts.length - 10)} contacts · ${S.contacts.filter((c) => c.optOut).length} opted out of offers`, `<button type="button" data-action="importContacts" class="${BTN_OUT}">${icon('upload', 'h-3.5 w-3.5')} Import CSV</button><button type="button" data-action="exportCsv" data-arg="contacts" class="${BTN_CTA}">${icon('download', 'h-3.5 w-3.5')} Export</button>`)}
    <div class="relative mb-4 max-w-sm">${icon('search', 'pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-muted-foreground')}<label for="contacts-q" class="sr-only">Search contacts</label><input id="contacts-q" data-input="contactsSearch" value="${esc(S.contactsQ || '')}" placeholder="Search name, phone or city" class="${INPUT} pl-8"></div>
    ${table(['Name', 'Channels', 'City', 'Language', 'Lead', 'Tags', 'Offers'], list.map((c) => { const l = leadFor(c.id); return `<tr class="border-b border-border last:border-0 hover:bg-surface-1">
      <td class="px-4 py-2.5"><button type="button" data-action="openContact" data-arg="${c.id}" class="flex items-center gap-2.5 text-left">${avatar(c.name, c.hue, 'h-8 w-8')}<span><span class="block font-medium text-foreground">${esc(c.name)}</span><span class="${META}">${esc(c.phone || '')}</span></span></button></td>
      <td class="px-4 py-2.5"><span class="flex gap-1">${Object.keys(c.ids).map((k) => chipIcon(CH[k].icon, CH[k].hue, 'h-6 w-6', 'h-3 w-3')).join('')}</span></td>
      <td class="px-4 py-2.5 text-foreground">${esc(c.city)}</td><td class="px-4 py-2.5 text-foreground">${esc(c.lang)}</td>
      <td class="px-4 py-2.5">${l ? pill(stage(l.stage).name, stage(l.stage).hue) : '<span class="text-muted-foreground">None</span>'}</td>
      <td class="px-4 py-2.5"><span class="flex flex-wrap gap-1">${c.tags.map((t) => neutralPill(t)).join('')}</span></td>
      <td class="px-4 py-2.5">${c.optOut ? pill('Opted out', 'coral', 'bell-off') : pill('Subscribed', 'emerald', 'bell')}</td></tr>`; }), 'Contacts')}
    <p class="mt-3 ${META}">Showing demo contacts. Customers who send STOP are opted out of marketing templates automatically.</p></div>`;
}
function renderOrders() {
  const st = { Draft: 'blue', Confirmed: 'violet', Paid: 'emerald', Fulfilled: 'teal', Cancelled: 'coral' };
  return `<div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">

    ${S.orders.length ? table(['Order', 'Customer', 'Items', 'Total', 'Status', 'Taken by', 'Placed'], S.orders.map((o) => { const ct = contact(o.contactId); return `<tr class="border-b border-border last:border-0 hover:bg-surface-1">
      <td class="px-4 py-2.5"><button type="button" data-action="openOrder" data-arg="${o.id}" class="font-mono text-[13px] font-medium text-primary hover:underline">${o.no}</button></td>
      <td class="px-4 py-2.5"><span class="flex items-center gap-2">${avatar(ct.name, ct.hue, 'h-7 w-7 text-[10px]', o.channel)}<span class="text-foreground">${esc(ct.name)}</span></span></td>
      <td class="px-4 py-2.5 text-foreground">${o.items.map((i) => `${esc(product(i.p).name)} (${i.size}) x${i.qty}`).join(', ')}</td>

      <td class="px-4 py-2.5 ${META}">${ago(o.at)} ago</td></tr>`; }), 'Orders') : emptyState('shopping-bag', 'emerald', 'No orders yet', 'Orders appear here when the AI or your team confirms one in chat.')}
    <div class="mt-4 rounded-[24px] border border-border bg-surface-1 p-4 text-[13px] text-muted-foreground">${icon('info', 'mr-1 inline h-3.5 w-3.5')} Try it: in the customer phone say “I want to order the ajrakh saree”, answer the questions and reply YES. The order appears here and the lead moves to Won.</div></div>`;

  if (tab === 'followups') {
    body = `<div class="grid gap-4 lg:grid-cols-3"><div class="space-y-4 lg:col-span-2">${S.followups.map((f) => `
      <section class="${CARD} p-5"><div class="flex flex-wrap items-center gap-3"><h2 class="flex-1 text-[15px] font-semibold text-foreground">${esc(f.name)}</h2>${toggle(f.active, 'toggleSeq', f.id, 'Sequence active')}</div>
        <p class="mt-1 ${META}">Starts when a lead in ${f.stages.map((s) => stage(s).name).join(' or ')} goes quiet · stops when they reply, an agent takes over, or they opt out</p>

          <span class="flex-1 text-[13px] text-foreground">${st.mode === 'lost' ? 'Move the lead to Lost with reason “No response”' : st.mode === 'text' ? 'Send a free-text reminder (only inside the 24-hour window)' : `Send template <span class="font-mono">${st.tpl}</span>`}</span>
          ${st.mode === 'template' ? pill('Works outside 24 h', 'emerald') : st.mode === 'text' ? pill('Inside 24 h only', 'amber') : ''}</li>`).join('')}</ol>
        <div class="mt-4 grid grid-cols-3 gap-3 text-center">${[['In sequence', f.enrolled], ['Sent', f.sent], ['Reply rate', f.sent ? Math.round((f.replied / f.sent) * 100) + '%' : '0%']].map(([k, v]) => `<div class="rounded-[18px] bg-background p-3 ring-1 ring-border"><p class="font-mono text-[18px] font-semibold tabular text-foreground">${v}</p><p class="${META}">${k}</p></div>`).join('')}</div>
      </section>`).join('')}</div>
      <aside class="space-y-4"><section class="rounded-[24px] bg-tint-violet p-5"><p class="text-[14px] font-semibold text-foreground">Try time travel</p><p class="mt-1 text-[13px] text-foreground/75">Press the button to move the demo clock forward one day. Leads that stayed quiet receive the next step. Watch Meera Iyer: her window is already closed, so she gets a template, never free text.</p><button type="button" data-action="simulateDay" class="${BTN_CTA} mt-4">${icon('fast-forward', 'h-3.5 w-3.5')} Simulate 24 hours</button>${S.clockOffset ? `<p class="mt-2 ${META}">Demo clock is ${Math.round(S.clockOffset / DAY)} day${S.clockOffset / DAY > 1 ? 's' : ''} ahead</p>` : ''}</section>
      <section class="${CARD} p-5"><p class="text-[13px] font-semibold text-foreground">Why templates?</p><p class="mt-1 text-[13px] text-muted-foreground">WhatsApp lets you send any text for 24 hours after the customer’s last message. After that, only templates approved by Meta can go out, and Meta bills them to your WhatsApp account. Marketing templates cost the most, so keep sequences short.</p></section></aside></div>`;
  } else if (tab === 'comments') {

        <p class="mt-4 ${LABEL}">Then</p><ul class="space-y-1.5 text-[13px] text-foreground"><li class="flex items-center gap-2">${icon('send', 'h-3.5 w-3.5 text-chip-violet')} The AI sends one private DM with the product, price and sizes</li><li class="flex items-center gap-2">${icon('user-plus', 'h-3.5 w-3.5 text-chip-blue')} A lead is created with source “Comment”</li><li class="flex items-center gap-2">${r.publicReply ? icon('check', 'h-3.5 w-3.5 text-chip-emerald') : icon('minus', 'h-3.5 w-3.5 text-muted-foreground')} Public reply under the comment${toggle(r.publicReply, 'togglePublic', r.id, 'Public reply')}</li></ul>

      <aside class="space-y-4"><section class="${CARD} p-5"><p class="text-[13px] font-semibold text-foreground">Latest post</p><div class="mt-3 flex aspect-[4/3] items-center justify-center rounded-[18px] ${HUE[product(post.productId).hue].tint}">${icon('shirt', 'h-14 w-14 ' + HUE[product(post.productId).hue].chip)}</div><p class="mt-2 text-[13px] text-foreground">${esc(post.caption)}</p>

  } else if (tab === 'hours') {

      <section class="space-y-4"><div class="${CARD} p-5"><h2 class="text-[15px] font-semibold text-foreground">Outside hours</h2><p class="mt-2 text-[13px] text-muted-foreground">The AI keeps helping. If someone asks for a person, it says when the team is back.</p><label for="away" class="${LABEL} mt-3">Message when a person is requested after hours</label><textarea id="away" rows="3" class="${INPUT}">Our team is back at 11 am. I have noted your question and someone will reply first thing.</textarea></div>

function series(n, seed, base, spread) { const r = seeded(seed); return Array.from({ length: n }, (_, i) => Math.round(base + Math.sin(i / 2) * spread * 0.4 + r() * spread)); }

   ===================================================================== */
function renderSim() {
  if (!S.sim.open || S.app === 'admin') return '';
  const key = S.sim.persona; const ct = personaContact(key); const ch = S.sim.channel;
  const allowed = Object.keys(ct.ids);
  const cv = allowed.includes(ch) ? convFor(ct, ch, false) : null;
  const hueC = CH[ch].hue; const myBubble = HUE[hueC].tint;

function simSend(text) {

}

  S.setupDone.sandbox = true; render(); setTimeout(() => $('#sb-in') && $('#sb-in').focus(), 20);
}
const SUBMIT = {
  sendComposer(fd, form) {

  testComment(fd) { const t = (fd.get('t') || '').trim(); S.commentTest = t; const p = product(S.posts[0].productId); const rule = S.commentRules.find((r) => r.active && r.keywords.some((k) => t.toLowerCase().includes(k)));

  addFaq(fd) { const q = fd.get('q').trim(), a = fd.get('a').trim(); if (!q || !a) return; S.faqs.push({ id: nid('f'), q, a, keys: q.toLowerCase().split(/\W+/).filter((w) => w.length > 3 && !['what', 'does', 'your', 'have', 'with', 'that', 'this', 'from'].includes(w)) }); toast('FAQ added. Ask the phone the same question.'); render(); },

  sandboxSend(fd) { sandboxSend(fd.get('t')); },
  invite(fd) { const email = fd.get('email').trim(); if (S.members.length + S.invites.length >= S.usage.seatsLimit && fd.get('role') !== 'Viewer') { S.modal = null; toast(`All ${S.usage.seatsLimit} seats are used. Add a seat for ₹399 a month or upgrade.`, { icon: 'triangle-alert', hue: 'amber' }); return; } S.invites.push({ email, role: fd.get('role') }); toast(`Invite sent to ${email}`); render(); },

/* =====================================================================
   EVENT WIRING
   ===================================================================== */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (S.menu && !e.target.closest('[data-action="menu"]') && !e.target.closest('.pop')) { S.menu = null; if (!t) { render(); return; } }
  if (!t) return;
  if (t.dataset.action === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-action="closeModal"]')) return;
  const fn = A[t.dataset.action]; if (fn && !(t.tagName === 'SELECT' || t.tagName === 'INPUT')) { e.preventDefault(); fn(t.dataset.arg, t, e); }
});
document.addEventListener('change', (e) => { const t = e.target.closest('[data-change]'); if (!t) return; const fn = A[t.dataset.change]; if (fn) fn(t.dataset.arg, t, e); });
document.addEventListener('input', (e) => { const t = e.target.closest('[data-input]'); if (!t) return; const fn = INPUT_H[t.dataset.input]; if (fn) fn(t); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) fn(new FormData(f), f); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'composer') { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.drawer) S.drawer = null; else if (S.menu) S.menu = null; else if (S.sim.open && window.innerWidth < 1280) S.sim.open = false; else return; render(); }
});
let DRAG = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest('[data-drag]'); if (!c) return; DRAG = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', DRAG); } catch (_) { /* old browsers */ } });
document.addEventListener('dragend', (e) => { const c = e.target.closest('[data-drag]'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over')); });
document.addEventListener('dragover', (e) => { const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return; e.preventDefault(); document.querySelectorAll('.drag-over').forEach((x) => x !== z && x.classList.remove('drag-over')); z.classList.add('drag-over'); });
document.addEventListener('drop', (e) => { const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return; e.preventDefault(); const l = S.leads.find((x) => x.id === DRAG); const prev = l.stage; DRAG = null;
  if (prev !== z.dataset.drop) { l.stage = z.dataset.drop; l.updated = now(); l.score = { new: 20, contacted: 45, qualified: 75, won: 100, lost: 0 }[l.stage]; if (l.stage === 'lost') l.lostReason = 'Marked lost by ' + member(S.me).name; toast(`${contact(l.contactId).name} moved to ${stage(l.stage).name}`, { undo: () => { l.stage = prev; } }); }
  render(); });
window.addEventListener('hashchange', applyHash);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) render(); });

/* init */
try { const th = localStorage.getItem('orbit-theme'); if (th === 'light' || th === 'dark') { S.theme = th; document.documentElement.setAttribute('data-theme', th); } } catch (_) { /* storage unavailable */ }
S.sim.open = false; S.route = ''; if (window.innerWidth < 768) S.tour.min = true;
applyHash();
setInterval(() => { const a = document.activeElement; if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return; if (S.impersonation && S.impersonation.ends < Date.now()) { S.impersonation = null; toast('Impersonation ended after 30 minutes'); } render(); }, 30000);
